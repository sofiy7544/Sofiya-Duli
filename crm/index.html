<!doctype html>
<html lang="ru" data-theme="atlas" data-family="atlas">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="On Top" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px)" href="./splash-iphone-15-16.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px)" href="./splash-iphone-13-14.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px)" href="./splash-iphone-max.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px)" href="./splash-iphone-x.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Приложение открывается на тёмном экране входа, поэтому стартовый цвет системных полос тёмный.
         После входа ThemeProvider меняет его на цвет темы (см. syncChromeColor). -->
    <meta name="theme-color" content="#05070A" />
    <!-- Постер экрана входа — первое, что видит человек. Предзагрузка тянет его
         параллельно со скриптом, а не после отрисовки: иначе первые кадры
         движения идут по пустому чёрному фону. -->
    <link rel="preload" as="image" fetchpriority="high" href="./assets/login-bg-poster-DRim0HOE.jpg" />
    <title>On Top Property — CRM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23344A39'/><path d='M9 21l7-11 7 11' stroke='%23F7F4EC' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <script>
      (function(){try{var t=localStorage.getItem('crm-preview-theme')||'atlas';var A=['atlas','sepia','venza'];if(A.indexOf(t)<0)t='atlas';
      var m=localStorage.getItem('crm-preview-mode')||'light';
      var dark=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
      var r=document.documentElement;
      r.classList.toggle('dark',dark);r.style.colorScheme=dark?'dark':'light';
      r.dataset.theme=t;r.dataset.family=t==='atlas'?'atlas':t==='venza'?'venza':'classic';}catch(e){}})();
    </script>
    <!-- Заставка до запуска приложения. Первое впечатление не должно ждать
         550 КБ скрипта: этот кадр рисуется сразу после разбора HTML, а постер
         к этому моменту уже тянется предзагрузкой. Кривые и числа те же, что
         у .signin__bg в src/styles/app.css — там анимация подхватывается
         ровно с того места, где её застал React (переменная --signin-t),
         поэтому в момент запуска приложения кадр не дёргается. -->
    <style>
      #boot { position: fixed; inset: 0; background: #05070A; overflow: hidden; }
      #boot > i { position: absolute; inset: 0; display: block;
        background: url(./assets/login-bg-poster-DRim0HOE.jpg) 50% 50% / cover no-repeat;
        animation: boot-fade 700ms ease-out both, boot-enter 2600ms cubic-bezier(.18, .55, .3, 1) both; }
      @keyframes boot-fade { from { opacity: .35 } to { opacity: 1 } }
      @keyframes boot-enter { from { transform: scale(1.22) translate3d(0, 1.4%, 0) } to { transform: scale(1.04) } }
      @media (prefers-reduced-motion: reduce) { #boot > i { animation: boot-fade 300ms linear both; transform: scale(1.04) } }
    </style>
    <script type="module" crossorigin src="./assets/index-BSbxZGA8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D2fcD4l8.css">
  </head>
  <body class="font-sans bg-background text-foreground antialiased">
    <div id="root"><div id="boot" aria-hidden="true"><i></i></div></div>
    <script>
      /* Заставка — кадр экрана входа. По глубокой ссылке (#/tasks и прочие)
         открывается не он, и фотографию входа показывать нельзя.
         Постер подставлен прямо в CSS выше: обычный скрипт ждёт загрузки
         внешней таблицы стилей, и на медленной сети кадр появлялся бы на
         секунду-полторы позже, чем мог. */
      (function () {
        if (location.hash && location.hash.indexOf('#/login') !== 0) document.getElementById('boot').remove();
      })();
    </script>
  </body>
</html>
